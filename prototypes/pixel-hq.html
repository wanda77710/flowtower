<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wanda Pixel HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2330;--pap:#f4f1e8;--teal:#22b8a6;--g:#3fc77a;--y:#f2b233;--r:#ef4f5f;--b:#4aa3ff;--mut:#7c8597;--px:"DotGothic16","Noto Sans TC",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d1020;color:var(--ink);font-family:var(--px);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{pointer-events:none}
.box{background:var(--pap);border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.35);border-radius:2px}
/* HUD */
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;pointer-events:none}
.pill{pointer-events:auto;padding:4px 9px;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill b{font-size:15px}
.led{width:8px;height:8px;background:var(--g);box-shadow:0 0 0 2px var(--ink);animation:bl 1.2s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
#apBtn{cursor:pointer;background:#fff4d6}
#zoom{position:fixed;right:8px;top:52px;display:flex;flex-direction:column;gap:6px;z-index:5}
.btn{pointer-events:auto;cursor:pointer;font:15px var(--px);padding:6px 10px;color:var(--ink)}
.btn.on{background:var(--b);color:#fff}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.35)}
/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;height:86px;background:#1b2030;border-top:3px solid var(--ink);display:flex;gap:8px;padding:8px;overflow-x:auto;z-index:6;touch-action:pan-x;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:150px;height:66px;background:var(--pap);border:3px solid var(--ink);display:flex;gap:6px;padding:4px;cursor:pointer;position:relative}
.card canvas{position:static;width:36px;height:54px;background:#cfe7d6;border:2px solid var(--ink)}
.card .n{font-size:13px;line-height:1.2;font-weight:700}
.card .s{font-size:11px;color:#4b5263;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .d{position:absolute;right:5px;top:5px;width:8px;height:8px;box-shadow:0 0 0 2px var(--ink)}
.card.al{animation:shake .5s steps(2) infinite}
@keyframes shake{50%{background:#ffd9dd}}
#joy{position:fixed;left:16px;bottom:104px;width:110px;height:110px;border:3px solid rgba(255,255,255,.5);background:rgba(0,0,0,.18);display:none;z-index:6;touch-action:none;border-radius:50%}
#knob{position:absolute;left:31px;top:31px;width:42px;height:42px;background:rgba(255,255,255,.85);border:3px solid var(--ink);border-radius:50%}
.walking #joy{display:block}
/* side panel = terminal */
#side{position:fixed;right:0;top:0;bottom:86px;width:400px;max-width:100%;background:#11151f;color:#d7e2f0;border-left:3px solid var(--ink);z-index:9;transform:translateX(105%);transition:transform .2s steps(4);display:flex;flex-direction:column}
#side.open{transform:none}
#sh{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#1b2030;border-bottom:3px solid #000}
#sh canvas{position:static;width:32px;height:48px;background:#cfe7d6;border:2px solid #000}
#sh h3{font-size:16px;color:#fff}
#sh p{font-size:11px;color:#8b97ab}
#x{margin-left:auto;background:none;border:none;color:#fff;font:22px var(--px);cursor:pointer;padding:2px 8px}
#sb{flex:1;overflow:auto;padding:10px 12px;font-size:12.5px;line-height:1.55;touch-action:pan-y}
.sec{color:#5dd6c4;margin:10px 0 4px;font-size:11px;letter-spacing:.1em}
.row{display:flex;gap:6px;padding:3px 0;border-bottom:1px dashed #263044}
.row .id{color:#8fb3ff;width:58px;flex:0 0 auto}
.row .m{flex:1;color:#b9c4d6}
.tag{padding:0 5px;color:#111;font-size:11px;white-space:nowrap;height:18px}
.tag.g{background:var(--g)}.tag.y{background:var(--y)}.tag.r{background:var(--r);color:#fff}
.msg{margin:6px 0;white-space:pre-wrap}
.msg.u{color:#ffd47a}.msg.u:before{content:"> "}
.msg.a{color:#d7e2f0;border-left:3px solid var(--teal);padding-left:8px}
.ap{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed #263044}
.ap div{flex:1}.ap small{display:block;color:#8b97ab}
.ap button{font:12px var(--px);background:var(--g);border:2px solid #000;padding:2px 8px;cursor:pointer}
#qs{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px}
#qs button{font:12px var(--px);background:#232a3b;color:#d7e2f0;border:2px solid #3a4560;padding:4px 8px;cursor:pointer}
#f{display:flex;gap:6px;padding:8px 12px 12px;border-top:3px solid #000}
#f input{flex:1;background:#0a0d14;border:2px solid #3a4560;color:#fff;font:14px var(--px);padding:8px;outline:none}
#f button{font:14px var(--px);background:var(--teal);border:2px solid #000;padding:0 12px;cursor:pointer}
/* log */
#log{position:fixed;left:8px;bottom:96px;width:300px;max-height:120px;overflow:hidden;font-size:11px;line-height:1.5;color:#e9f1ff;z-index:4;pointer-events:none;text-shadow:1px 1px 0 #000}
#log div{animation:fin .3s steps(3)}
@keyframes fin{from{opacity:0}}
.walking #log{display:none}
#toast{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
.toast{background:#ffd9dd;border:3px solid var(--ink);padding:4px 10px;font-size:13px;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
/* join */
#join{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,12,24,.72)}
#join .box{width:min(340px,90vw);padding:18px;text-align:center}
#join h1{font-size:24px;letter-spacing:.06em}
#join h1 em{font-style:normal;color:var(--teal)}
#join p{font-size:12px;color:#4b5263;margin:6px 0 12px;line-height:1.6}
#join input{width:100%;border:3px solid var(--ink);background:#fff;font:16px var(--px);padding:8px;text-align:center;outline:none;margin-bottom:10px}
.cols{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.cols i{width:26px;height:26px;border:3px solid var(--ink);cursor:pointer}
.cols i.sel{outline:3px solid var(--teal);outline-offset:2px}
#go{width:100%;font:17px var(--px);background:var(--teal);border:3px solid var(--ink);padding:9px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
@media (max-width:640px){
  #side{bottom:0;top:28%;width:100%;border-left:none;border-top:3px solid var(--ink)}
  #log{width:220px;font-size:10px;max-height:90px}
  .pill{font-size:12px;padding:3px 7px}.pill b{font-size:13px}
  .hm{display:none}
  #zoom{top:92px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="ov"></canvas>

<div id="hud">
  <div class="pill box"><span class="led"></span><b>WANDA HQ</b><span id="clk">--:--</span><span style="color:var(--mut);font-size:11px">×60</span></div>
  <div class="pill box">待處理 <b id="kP">0</b></div>
  <div class="pill box">準時 <b id="kO" style="color:#1d9a55">—</b></div>
  <div class="pill box">警示 <b id="kA" style="color:var(--r)">0</b></div>
  <div class="pill box" id="apBtn">⏳ 核准 <b id="kAp" style="color:#c27a00">0</b></div>
  <div class="pill box hm">在線 <b id="kN">1</b></div>
</div>
<div id="zoom">
  <button class="btn box" id="bWalk">🚶</button>
  <button class="btn box" id="bIn">＋</button>
  <button class="btn box" id="bOut">－</button>
  <button class="btn box" id="bT">🚚</button>
  <button class="btn box" id="bA">🤖</button>
</div>
<div id="log"></div>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<div id="bar"></div>

<div id="side">
  <div id="sh"><canvas id="sPic" width="12" height="20"></canvas><div><h3 id="sT">-</h3><p id="sS">-</p></div><button id="x">×</button></div>
  <div id="sb"></div>
  <div id="qs"></div>
  <form id="f"><input id="q" placeholder="輸入問題…" autocomplete="off"><button>送出</button></form>
</div>

<div id="join"><div class="box">
  <h1>WANDA <em>PIXEL</em> HQ</h1>
  <p>運輸塔台 × AI Agent 辦公室（Demo 假資料）<br>打開同一個連結的人，會出現在同一層樓</p>
  <input id="nm" maxlength="10" value="Wanda">
  <div class="cols" id="cols"></div>
  <button id="go">▶ 進入辦公室</button>
</div></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mobile=innerWidth<700;

/* ================= MAP ================= */
const T=16, MW=66, MH=40;
// tile ids: 0 space,1 room floor,2 corridor,3 green office,4 wall,5 dock,6 road,7 tech floor,8 meeting floor
const map=[], solid=[];
for(let y=0;y<MH;y++){map.push(new Array(MW).fill(0));solid.push(new Array(MW).fill(false));}
const fill=(x0,y0,x1,y1,v)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)map[y][x]=v;};
fill(0,0,65,36,4);           // building shell walls
fill(1,1,36,32,2);           // transport corridors
fill(1,33,36,35,5);          // dock
fill(38,1,64,35,3);          // agent office
for(const y of [6,7,11,12,22,23,33,34]) map[y][37]=y>=33?5:2; // divider doors
fill(0,37,65,39,6);          // road
for(const x of [6,7,18,19,30,31]) map[36][x]=5; // dock gates

const WH=[
 {code:'FTZ',name:'FTZ 自貿區倉',c:'#4aa3ff'},{code:'TY2',name:'TY2 桃園二倉',c:'#ff8a3d'},{code:'HC',name:'HC 新竹倉',c:'#f2c230'},
 {code:'XS',name:'XS 倉',c:'#a77bff'},{code:'LK',name:'LK 倉',c:'#3fc77a'},{code:'TC',name:'TC 台中倉',c:'#ff5d8f'},
 {code:'TN',name:'TN 台南倉',c:'#22c3c3'},{code:'QT',name:'QT 倉',c:'#8fc43a'},{code:'QZ',name:'QZ 倉',c:'#ff6f5d'}];
const RX=[2,14,26], RY=[2,13,24];
WH.forEach((w,i)=>{
  const rx=RX[i%3], ry=RY[Math.floor(i/3)];
  w.r={x:rx,y:ry,w:10,h:9};
  fill(rx,ry,rx+9,ry+8,4); fill(rx+1,ry+1,rx+8,ry+7,1);
  map[ry+8][rx+4]=1; map[ry+8][rx+5]=1; // door
  w.door={x:rx+4,y:ry+9};
});
const AG=[
 {code:'秘',name:'專業秘書',role:'行程、提醒、人生／年度規劃',c:'#4aa3ff',tasks:['整理本週會議行動項目','更新年度計畫 Q4','排明天待辦優先順序','起草給主管的週報']},
 {code:'股',name:'股票追蹤',role:'每晚判讀個股，推播 LINE 圖卡',c:'#3fc77a',tasks:['抓今日收盤資料','判讀觀察清單 12 檔','產生 LINE 圖卡','比對分析師提及個股']},
 {code:'P',name:'專案管理平台',role:'GM 專案追蹤，Teams 提醒',c:'#f2b233',tasks:['會議紀錄 → 任務','Teams 提醒 3 位負責人','標記逾期專案','產生週進度表']},
 {code:'TMS',name:'TMS 資料更新',role:'Data_update.py：Oracle → CSV → Power BI',c:'#ff8a3d',tasks:['擷取 Oracle TMS','清洗欄位與日期','輸出 CSV','檢查筆數差異']},
 {code:'LINE',name:'司機 LINE',role:'200+ 司機：教材、簽到、排班、照片',c:'#06c755',tasks:['推播明日排班','收簽到 182/214','整理交貨照片','提醒未確認司機']},
 {code:'缺',name:'缺車分析',role:'叫不到車的根因分析',c:'#ff5d8f',tasks:['彙整叫車紀錄','比對供應商回覆','找出尖峰時段','起草改善建議']},
 {code:'副',name:'副業 Agent',role:'獨立工作者：內容、客戶、現金流',c:'#a77bff',tasks:['整理 IG 靈感','規劃本週內容','追蹤副業收入','研究像素辦公室']}];
const AP=[[39,2],[47,2],[55,2],[39,26],[47,26],[55,26],[39,14]];
AG.forEach((a,i)=>{a.r={x:AP[i][0],y:AP[i][1],w:7,h:7};});
const BRAIN={x:47,y:13,w:9,h:9};
fill(47,14,55,21,7);
const MEET={x:58,y:12,w:7,h:11};
fill(58,12,64,22,4); fill(59,13,64,21,8); map[16][58]=8; map[17][58]=8; map[18][58]=8;

for(let y=0;y<MH;y++)for(let x=0;x<MW;x++) if(map[y][x]===4||map[y][x]===0||map[y][x]===6) solid[y][x]=true;
const solidRect=(x,y,w=1,h=1)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)solid[j][i]=true;};

/* ================= SPRITES ================= */
const SK=['#f2c9a0','#e3b089','#c98e62'], HR=['#2b1d14','#5a3a22','#1c1c1c','#b8692a','#e3c56f','#6b2f2f'];
function look(shirt,seed){const r=seed??Math.floor(Math.random()*999);return {shirt,skin:SK[r%3],hair:HR[(r>>2)%HR.length],pants:['#2f3a56','#3b3b3b','#4d3b2a'][(r>>4)%3],style:(r>>3)%3};}
function dk(hex,f=.75){const n=parseInt(hex.slice(1),16);const r=(n>>16)*f|0,g=((n>>8)&255)*f|0,b=(n&255)*f|0;return `rgb(${r},${g},${b})`;}
function drawChar(c,x,y,L,dir,fr,sit,carry,typing){
  x=Math.round(x);y=Math.round(y);const Y=y-19;const R=(a,b,w,h,col)=>{c.fillStyle=col;c.fillRect(a,b,w,h);};
  R(x-5,y-1,10,2,'rgba(0,0,0,.25)');
  if(!sit){const s=fr%4;const l=s===1?-1:0,r=s===3?-1:0;
    R(x-4,Y+14+l,3,4,L.pants);R(x+1,Y+14+r,3,4,L.pants);R(x-4,Y+18+l,3,1,'#222');R(x+1,Y+18+r,3,1,'#222');}
  R(x-5,Y+8,10,7,L.shirt);R(x-5,Y+14,10,1,dk(L.shirt));
  const sw=(!sit&&fr%4===1)?1:(!sit&&fr%4===3)?-1:0, tp=typing?(fr%2):0;
  if(dir==='up'&&sit){R(x-6,Y+9-tp,1,4,L.shirt);R(x+5,Y+9+tp-1,1,4,L.shirt);}
  else{R(x-6,Y+9+sw,1,4,L.shirt);R(x+5,Y+9-sw,1,4,L.shirt);R(x-6,Y+13+sw,1,1,L.skin);R(x+5,Y+13-sw,1,1,L.skin);}
  R(x-4,Y+1,8,7,L.skin);
  R(x-4,Y,8,2,L.hair);R(x-5,Y+1,1,4,L.hair);R(x+4,Y+1,1,4,L.hair);
  if(L.style===1){R(x-5,Y+1,1,7,L.hair);R(x+4,Y+1,1,7,L.hair);}
  if(L.style===2){R(x-3,Y-1,6,1,L.hair);}
  if(dir==='up'){R(x-4,Y+2,8,5,L.hair);}
  else if(dir==='left'){R(x+1,Y+2,3,3,L.hair);R(x-3,Y+4,1,1,'#222');}
  else if(dir==='right'){R(x-4,Y+2,3,3,L.hair);R(x+2,Y+4,1,1,'#222');}
  else{R(x-2,Y+4,1,1,'#222');R(x+1,Y+4,1,1,'#222');R(x-1,Y+6,2,1,dk(L.skin,.85));}
  if(carry){R(x-4,Y+8,8,6,'#c99a5a');R(x-4,Y+10,8,1,'#a57a40');R(x-1,Y+8,2,6,'#e8d0a0');}
}
function portrait(cv,L){const c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);drawChar(c,6,cv.height-1,L,'down',0,false,false,false);}

/* ================= BACKGROUND ================= */
const bg=document.createElement('canvas'); bg.width=MW*T; bg.height=MH*T;
const g=bg.getContext('2d');
const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
// space + stars
R(0,0,bg.width,bg.height,'#0d1020');
for(let i=0;i<500;i++){R(ri(0,bg.width),ri(0,bg.height),1,1,pick(['#3a4370','#6c78b8','#ffffff']));}
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  const t=map[y][x],X=x*T,Y=y*T;
  if(t===1){R(X,Y,T,T,'#e4e6ea');R(X,Y,T,1,'#cfd3da');R(X,Y,1,T,'#cfd3da');if((x+y)%2)R(X+1,Y+1,T-1,T-1,'#e9ebee');}
  else if(t===2){R(X,Y,T,T,'#c9ced6');R(X,Y,T,1,'#b7bdc7');R(X,Y,1,T,'#b7bdc7');}
  else if(t===3){R(X,Y,T,T,(x+y)%2?'#7cc497':'#86cc9f');R(X,Y,T,1,'#6fb78a');}
  else if(t===5){R(X,Y,T,T,'#b9b4a6');if((x+y)%4===0)R(X+2,Y+7,12,2,'#e2c14a');}
  else if(t===6){R(X,Y,T,T,'#3b3f4a');if(y===38&&x%3===0)R(X+2,Y+7,10,2,'#e8e8e8');}
  else if(t===7){R(X,Y,T,T,'#273049');R(X,Y,T,1,'#334063');R(X,Y,1,T,'#334063');}
  else if(t===8){R(X,Y,T,T,'#d8c7a5');R(X,Y,T,1,'#c6b38d');}
  else if(t===4){
    const below=y+1<MH?map[y+1][x]:0;
    if(below!==4&&below!==0&&below!==6){ // wall face
      R(X,Y,T,T,'#f3f4f6');R(X,Y,T,3,'#9aa3b2');R(X,Y+T-3,T,3,'#7d8696');R(X,Y+T-4,T,1,'#22b8a6');
    }else{R(X,Y,T,T,'#9aa3b2');R(X+1,Y+1,T-2,T-2,'#aab2bf');}
  }
}
// road edge
R(0,37*T,bg.width,2,'#e2c14a');
/* furniture */
function desk(tx,ty){const X=tx*T,Y=ty*T;
  R(X+1,Y+5,30,9,'#c8a26b');R(X+1,Y+5,30,1,'#dcb985');R(X+1,Y+13,30,1,'#9c7a48');R(X+3,Y+14,2,2,'#6b5232');R(X+27,Y+14,2,2,'#6b5232');
  R(X+10,Y-5,12,10,'#2a2f3a');R(X+15,Y+5,2,2,'#2a2f3a');R(X+11,Y+8,10,2,'#eceff3');R(X+24,Y+7,3,3,'#f4f4f4');R(X+25,Y+8,1,1,'#7b4a2a');
  R(X+11,Y+18,10,6,'#39404f');R(X+12,Y+24,8,1,'#2a2f3a');
  solidRect(tx,ty,2,1);
}
function plant(tx,ty){const X=tx*T,Y=ty*T;R(X+4,Y+9,8,6,'#b07a48');R(X+4,Y+9,8,1,'#c99260');R(X+3,Y+2,10,7,'#3f9a55');R(X+5,Y,6,3,'#4fb466');R(X+2,Y+4,2,3,'#3f9a55');R(X+12,Y+4,2,3,'#358a49');R(X+6,Y+3,2,2,'#6fd086');solidRect(tx,ty);}

/* ================= PATHFINDING ================= */
function walkable(x,y){return x>=0&&y>=0&&x<MW&&y<MH&&!solid[y][x];}
function bfs(sx,sy,tx,ty){
  if(!walkable(tx,ty)) return null;
  const key=(x,y)=>y*MW+x, prev=new Map([[key(sx,sy),-1]]), q=[[sx,sy]];
  while(q.length){const [x,y]=q.shift(); if(x===tx&&y===ty)break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(!prev.has(k)&&walkable(nx,ny)){prev.set(k,key(x,y));q.push([nx,ny]);}}}
  if(!prev.has(key(tx,ty))) return null;
  const path=[];let k=key(tx,ty);while(k!==-1){path.push({x:(k%MW)*T+8,y:Math.floor(k/MW)*T+12});k=prev.get(k);}
  return path.reverse();
}

function newOrder(w,base){const dep=base+ri(-30,180),late=Math.random()<.22;
  const o={id:'TW'+(seq++),w,cust:pick(CUST),dest:pick(DEST),dep,eta:dep+ri(35,110),tReady:dep-15-ri(0,30)+(late&&Math.random()<.4?ri(12,35):0),tHand:dep+ri(-8,2)+(late&&Math.random()<.5?ri(6,25):0),stage:0,flag:'g',why:''};

function step(o,silent){const t=simMin,prev=o.flag;
  o.stage=t>=o.tDel?3:t>=o.tHand?2:t>=o.tReady?1:0;let f='g',why='正常';
  if(o.stage===0&&t>o.dep-15){f='y';why='T−15 未備妥';} if(o.stage===0&&t>o.dep-5){f='r';why='T−5 仍未備妥';}
  if(o.stage===1&&t>o.dep){f='r';why='T0 未交車';}else if(o.stage===1&&t>o.dep-5){f='y';why='待交司機';}
  if(o.stage===2&&t>o.eta){f='y';why='超過 ETA';} if(o.stage===2&&t>o.eta+30){f='r';why='ETA+30 未送達';}
  if(o.stage===3){f='g';why='已送達';}
  if(!silent){

    if(o._st!==undefined&&o._st<3&&o.stage===3){delivered++;if(o.tDel<=o.eta+30)onTime++;}
    if(f==='r'&&prev!=='r') alarm(o,why);
  }

  renderSide();$('side').classList.add('open');if(walking&&!mobile){}
}
$('x').onclick=()=>{$('side').classList.remove('open');cur=null;};
$('apBtn').onclick=()=>openSide({type:'hq'});
$('qs').onclick=e=>{if(e.target.tagName==='BUTTON')ask(e.target.textContent);};
$('f').onsubmit=e=>{e.preventDefault();const v=$('q').value.trim();if(v){$('q').value='';ask(v);}};
$('sb').addEventListener('click',e=>{const i=e.target.dataset.ap;if(i===undefined)return;const p=approvals.splice(+i,1)[0];log(`<span style="color:#7dffb0">✓ ${fmt(simMin)} 已核准：${esc(p.t)}</span>`);brainNotes++;renderSide();});
const whOrders=w=>orders.filter(o=>o.w===w&&o.stage<3).sort((a,b)=>({r:0,y:1,g:2}[a.flag]-{r:0,y:1,g:2}[b.flag])||a.dep-b.dep);
function renderSide(){if(!cur)return;const sb=$('sb'),keep=sb.scrollTop;let h='';
  if(cur.type==='wh'){const L=whOrders(cur.w);h+=`<div class="sec">// PENDING ${L.length} 張・${fmt(simMin)}</div>`+L.slice(0,14).map(o=>`<div class="row"><span class="id">${o.id}</span><span class="m">${o.cust}→${o.dest}<br><span style="color:#6c7891">出發 ${fmt(o.dep)}・ETA ${fmt(o.eta)}</span></span><span class="tag ${o.flag}">${STG[o.stage]}${o.flag!=='g'?'・'+o.why:''}</span></div>`).join('');}
  else if(cur.type==='ag'){const a=cur.a;h+=`<div class="sec">// STATUS</div><div>${a.running?'<span style="color:#7dffb0">● RUNNING</span>':'<span style="color:#888">○ IDLE</span>'}　${a.task}</div><div style="margin-top:6px;height:10px;background:#263044"><div style="height:100%;width:${Math.round(a.prog*100)}%;background:${a.c}"></div></div><div style="color:#8b97ab;margin-top:4px">今日完成 ${a.done} 件・寫入共用大腦</div>`;}
  else{h+=`<div class="sec">// 等你核准 ${approvals.length}</div>`+(approvals.map((p,i)=>`<div class="ap"><div>${esc(p.t)}<small>${esc(p.a)}</small></div><button data-ap="${i}">核准</button></div>`).join('')||'<div style="color:#8b97ab">都處理完了 ✓</div>');
    h+=`<div class="sec">// AGENTS</div>`+AG.map(a=>`<div class="row"><span class="id" style="color:${a.c}">${a.name}</span><span class="m">${a.running?a.task:'待命'}</span><span style="color:#8b97ab">${Math.round(a.prog*100)}%</span></div>`).join('');
    h+=`<div class="sec">// BRAIN</div><div>${brainNotes.toLocaleString()} 則共用筆記</div>`;}
  h+=`<div class="sec">// CHAT</div>`+(chat.length?chat.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join(''):'<div style="color:#6c7891">點下面的問題或直接輸入（由 Claude 回答，資料為 Demo 假資料）</div>');
  sb.innerHTML=h;sb.scrollTop=chat.length?sb.scrollHeight:keep;}
async function ask(q){if(!cur||busy)return;busy=true;chat.push({role:'user',content:q});const ans={role:'assistant',content:'…'};chat.push(ans);renderSide();
  try{const sample=window.claude&&claude.use?await claude.use('sample'):null;if(!sample)throw{code:'none'};let ctx;
    if(cur.type==='wh'){const L=whOrders(cur.w);ctx=`你是「${cur.w.name}」的庫房 agent。模擬時間 ${fmt(simMin)}。檢查點：T−15 備妥、T0 交司機、ETA、ETA+30 未送達=逾時。待處理訂單：${JSON.stringify(L.map(o=>({單號:o.id,客戶:o.cust,目的地:o.dest,出發:fmt(o.dep),ETA:fmt(o.eta),階段:STG[o.stage],燈號:{g:'綠',y:'黃',r:'紅'}[o.flag],原因:o.why})))}`;}
    else if(cur.type==='ag'){const a=cur.a;ctx=`你是 Wanda 的 AI 辦公室裡的「${a.name}」，職責：${a.role}。目前${a.running?'執行':'待命'}「${a.task}」(${Math.round(a.prog*100)}%)，今天完成 ${a.done} 件。同事：${AG.map(x=>x.name).join('、')}。待核准：${approvals.map(p=>p.t).join('、')||'無'}。`;}
    else{const per=WH.map(w=>{const L=orders.filter(o=>o.w===w&&o.stage<3);return `${w.code}:待${L.length}/紅${L.filter(o=>o.flag==='r').length}/黃${L.filter(o=>o.flag==='y').length}`;}).join('；');
      ctx=`你是 Wanda HQ 的總管（共用大腦）。模擬時間 ${fmt(simMin)}。庫房狀況：${per}。今日已送達 ${delivered}，準時 ${onTime}。Agents：${AG.map(a=>`${a.name}${a.running?'執行':'待命'}「${a.task}」`).join('；')}。待核准：${approvals.map(p=>`${p.t}(${p.a})`).join('、')||'無'}。`;}
    const sys=`${ctx}\n規則：繁體中文，像可靠的同事，先講結論，條列，120 字內。只根據上述資料，不知道就說不知道。這是 Demo 假資料。`;
    const r=await sample([{role:'user',content:sys+'\n（以上為背景）'},{role:'assistant',content:'了解，請說。'},...chat.slice(0,-1).slice(-8)],{modelTier:'quick',cache:false,onText:({text})=>{ans.content=text;renderSide();}});
    ans.content=r.text||ans.content;}
  catch(e){ans.content=e&&e.code==='rate_limited'?'太多人在問，稍等再試。':e&&e.code==='not_granted'?'需要先允許 AI 對話（第一次會跳提示）。':'AI 對話在這個檢視中無法使用，請在 claude.ai 開啟。';}
  busy=false;renderSide();}

/* ================= BOTTOM BAR ================= */
const cards=[];
function buildBar(){const bar=$('bar');
  [...WH.map(w=>({ref:{type:'wh',w},name:w.name,L:w.staff[0].L})),...AG.map(a=>({ref:{type:'ag',a},name:a.name,L:a.staff[0].L}))].forEach(it=>{
    const d=document.createElement('div');d.className='card';d.innerHTML=`<canvas width="12" height="20"></canvas><div><div class="n">${it.name}</div><div class="s"></div></div><span class="d"></span>`;
    portrait(d.querySelector('canvas'),it.L);d.onclick=()=>openSide(it.ref);bar.appendChild(d);cards.push({d,it});});}
buildBar();
function tickUI(){
  let pend=0,al=0;
  WH.forEach(w=>{const L=orders.filter(o=>o.w===w&&o.stage<3);const r=L.filter(o=>o.flag==='r').length,y=L.filter(o=>o.flag==='y').length;pend+=L.length;al+=r;w.cnt={n:L.length,r,y};w.worst=r?'r':y?'y':'g';});
  $('kP').textContent=pend;$('kA').textContent=al;$('kO').textContent=delivered?Math.round(onTime/delivered*100)+'%':'—';$('clk').textContent=fmt(simMin);$('kAp').textContent=approvals.length;
  cards.forEach(({d,it})=>{const s=d.querySelector('.s'),dot=d.querySelector('.d');
    if(it.ref.type==='wh'){const c=it.ref.w.cnt;s.textContent=`待處理 ${c.n}・紅 ${c.r}・黃 ${c.y}`;dot.style.background={g:'#3fc77a',y:'#f2b233',r:'#ef4f5f'}[it.ref.w.worst];d.classList.toggle('al',c.r>0);}
    else{const a=it.ref.a;s.textContent=a.running?`${Math.round(a.prog*100)}%・${a.task}`:'待命';dot.style.background=a.running?'#3fc77a':'#9aa3b2';}});
  renderSide();
}

/* ================= RENDER ================= */
const statusCol={g:'#3fc77a',y:'#f2b233',r:'#ef4f5f'};
let T0=performance.now(),acc=0,uacc=0,clock=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-T0)/1000,.05);T0=now;clock+=dt;
  acc+=dt;if(acc>=1){acc=0;try{simTick();}catch(e){console.error(e);}}
  uacc+=dt;if(uacc>=1){uacc=0;try{tickUI();}catch(e){console.error(e);}}
  try{update(dt);draw();}catch(e){console.error(e);}
}
function moveAlong(a,dt){if(!a.path||a.pi>=a.path.length)return false;const p=a.path[a.pi];const dx=p.x-a.x,dy=p.y-a.y,L=Math.hypot(dx,dy),st=a.speed*dt;
  if(L<=st){a.x=p.x;a.y=p.y;a.pi++;}else{a.x+=dx/L*st;a.y+=dy/L*st;}
  a.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');a.moving=true;return true;}
function update(dt){
  const anim=Math.floor(clock*8);
  for(let i=actors.length-1;i>=0;i--){const a=actors[i];a.moving=false;
    if(a.me){let mx=0,my=0;if(walking){if(keys.w||keys.arrowup)my--;if(keys.s||keys.arrowdown)my++;if(keys.a||keys.arrowleft)mx--;if(keys.d||keys.arrowright)mx++;mx+=joy.x;my+=joy.y;}
      const L=Math.hypot(mx,my);
      if(L>.15){a.path=null;mx/=Math.max(1,L);my/=Math.max(1,L);const sp=a.speed*dt;const nx=a.x+mx*sp,ny=a.y+my*sp;
        const ok=(x,y)=>walkable(Math.floor((x-4)/T),Math.floor((y-2)/T))&&walkable(Math.floor((x+4)/T),Math.floor((y-2)/T))&&walkable(Math.floor((x-4)/T),Math.floor(y/T))&&walkable(Math.floor((x+4)/T),Math.floor(y/T));
        if(ok(nx,a.y))a.x=nx;if(ok(a.x,ny))a.y=ny;a.dir=Math.abs(mx)>Math.abs(my)?(mx>0?'right':'left'):(my>0?'down':'up');a.moving=true;}
      else moveAlong(a,dt);
      push(false);}
    else if(a.peer){const dx=a.tx-a.x,dy=a.ty-a.y;if(Math.hypot(dx,dy)>.5){a.x+=dx*Math.min(1,dt*10);a.y+=dy*Math.min(1,dt*10);a.moving=true;}}
    else if(!a.sit){const m=moveAlong(a,dt);
      if(!m){if(a.wander){a.wait-=dt;if(a.wait<=0){wander(a);a.wait=rnd(2,6);}}else if(a.temp){actors.splice(i,1);a.onDone&&a.onDone();continue;}}}
    a.fr=a.sit?(a.typing?Math.floor(clock*6+i):0):(a.moving?anim:0);
    if(a.bt>0)a.bt-=dt;
  }
  trucks.forEach(t=>{if(t.wait>0){t.wait-=dt;return;}t.x+=t.dir*60*dt;});for(let i=trucks.length-1;i>=0;i--)if(trucks[i].x<-60||trucks[i].x>MW*T+60)trucks.splice(i,1);
  sparks.forEach(s=>s.t+=dt*.7);for(let i=sparks.length-1;i>=0;i--)if(sparks[i].t>=1)sparks.splice(i,1);
  WH.forEach(w=>w.flash=Math.max(0,(w.flash||0)-dt));
  // camera
  if(walking&&me){camGoal=null;const tx=me.x-VW/2,ty=me.y-(VH-86/S)/2;cam.x+=(tx-cam.x)*Math.min(1,dt*6);cam.y+=(ty-cam.y)*Math.min(1,dt*6);clampCam();}
  else if(camGoal){cam.x+=(camGoal.x-cam.x)*Math.min(1,dt*5);cam.y+=(camGoal.y-cam.y)*Math.min(1,dt*5);clampCam();if(Math.abs(camGoal.x-cam.x)<.5&&Math.abs(camGoal.y-cam.y)<.5)camGoal=null;}
}
function draw(){
  const cx=Math.round(cam.x),cy=Math.round(cam.y),c=ctx,blink=Math.floor(clock*3)%2;
  c.fillStyle='#0d1020';c.fillRect(0,0,VW,VH);c.drawImage(bg,-cx,-cy);
  c.save();c.translate(-cx,-cy);
  // screens & lamps
  WH.forEach(w=>{const col=w.worst==='r'?(blink?'#ef4f5f':'#7a1f2a'):w.worst==='y'?'#f2b233':'#1fd1a8';
    w.screens.forEach((s,k)=>{c.fillStyle=col;c.fillRect(s.x,s.y,10,8);c.fillStyle='rgba(255,255,255,.7)';for(let j=0;j<3;j++)c.fillRect(s.x+1,s.y+1+j*2,((Math.floor(clock*4)+j*3+k)%7)+2,1);});
    c.fillStyle='#1b2030';c.fillRect(w.lamp.x-1,w.lamp.y-1,8,8);c.fillStyle=w.worst==='r'?(blink?'#ff3347':'#5a1520'):statusCol[w.worst];c.fillRect(w.lamp.x,w.lamp.y,6,6);
    if(w.worst==='r'&&blink){c.fillStyle='rgba(239,79,95,.13)';c.fillRect((w.r.x+1)*T,(w.r.y+1)*T,8*T,7*T);}});
  AG.forEach(a=>a.screens.forEach((s,k)=>{c.fillStyle=a.running?'#203a5c':'#1b2030';c.fillRect(s.x,s.y,10,8);if(a.running){c.fillStyle=a.c;for(let j=0;j<3;j++)c.fillRect(s.x+1,s.y+1+j*2,((Math.floor(clock*5)+j*2+k)%8)+1,1);}}));
  // brain core
  {const p=(Math.sin(clock*3)+1)/2;c.fillStyle=`rgba(34,184,166,${.25+p*.35})`;c.fillRect(51*T-4,17*T-4,3*T+8,2*T+8);c.fillStyle='#22b8a6';c.fillRect(51*T+2,17*T+2,3*T-4,2*T-4);c.fillStyle='#d9fff8';c.fillRect(52*T+4-p*4,17*T+10-p*3,8+p*8,12+p*6);
   for(const [tx,ty] of [[48,15],[54,15],[48,20],[54,20]])for(let k=0;k<5;k++){c.fillStyle=((Math.floor(clock*6)+k+tx)%3)?'#3fc77a':'#1b2030';c.fillRect(tx*T+10,ty*T-6+k*4,1,1);c.fillStyle=((Math.floor(clock*4)+k)%4)?'#4aa3ff':'#1b2030';c.fillRect(tx*T+8,ty*T-6+k*4,1,1);}}
  // y-sorted actors + trucks
  const list=[...actors.map(a=>({y:a.y,a})),...trucks.map(t=>({y:t.y,t}))].sort((p,q)=>p.y-q.y);
  c.restore();
  list.forEach(o=>{if(o.t)drawTruck(c,o.t,cx,cy);else{const a=o.a;drawChar(c,a.x-cx,a.y-cy,a.L,a.dir,a.fr,a.sit,a.carry,a.sit&&a.typing);}});
  // sparks
  sparks.forEach(s=>{const x=s.x+(s.tx-s.x)*s.t-cx,y=s.y+(s.ty-s.y)*s.t-Math.sin(s.t*Math.PI)*40-cy;c.fillStyle=s.c;c.fillRect(Math.round(x)-1,Math.round(y)-1,3,3);c.fillStyle='#fff';c.fillRect(Math.round(x),Math.round(y),1,1);});
  drawOverlay(cx,cy,blink);
}
function drawOverlay(cx,cy,blink){
  const o=oc;o.setTransform(1,0,0,1,0,0);o.clearRect(0,0,ov.width,ov.height);o.setTransform(DPR,0,0,DPR,0,0);
  const sx=x=>(x-cx)*S, sy=y=>(y-cy)*S;
  const fs=clamp(S*4.2,10,18);
  function tag(text,x,y,bgc,fg,bd='#1d2330'){o.font=`${fs}px "DotGothic16","Noto Sans TC",monospace`;const w=o.measureText(text).width+10,h=fs+6;const X=Math.round(x-w/2),Y=Math.round(y-h);
    o.fillStyle='rgba(0,0,0,.35)';o.fillRect(X+2,Y+2,w,h);o.fillStyle=bgc;o.fillRect(X,Y,w,h);o.strokeStyle=bd;o.lineWidth=2;o.strokeRect(X+1,Y+1,w-2,h-2);o.fillStyle=fg;o.textBaseline='middle';o.fillText(text,X+5,Y+h/2+1);}
  // zone titles
  tag('🚚 運輸塔台',sx(19*T),sy(1*T)+fs+4,'#1d2330','#fff','#22b8a6');
  tag('🤖 AI AGENT 辦公室',sx(51.5*T),sy(1*T)+fs+4,'#1d2330','#fff','#22b8a6');
  tag('THE BRAIN・'+brainNotes.toLocaleString(),sx(52.5*T),sy(14*T),'#11151f','#5dffe8','#22b8a6');
  tag('會議室',sx(61.5*T),sy(12.6*T),'#f4f1e8','#1d2330');
  tag('出貨碼頭 DOCK',sx(19*T),sy(33.2*T),'#f2b233','#1d2330');
  WH.forEach(w=>{const c=w.cnt||{n:0,r:0,y:0};const t=`${w.code} ${c.n}`+(c.y?` !${c.y}`:'')+(c.r?` ✕${c.r}`:'');
    tag(t,sx((w.r.x+5)*T),sy((w.r.y+1)*T)-2,w.worst==='r'?(blink?'#ef4f5f':'#ffd9dd'):'#f4f1e8',w.worst==='r'&&blink?'#fff':'#1d2330',w.c);});
  AG.forEach(a=>tag(`${a.name}${a.running?' '+Math.round(a.prog*100)+'%':' 待命'}`,sx((a.r.x+3.5)*T),sy((a.r.y+2)*T)-2,'#f4f1e8','#1d2330',a.c));
  // bubbles & names
  actors.forEach(a=>{
    if(a.me) tag(myName,sx(a.x),sy(a.y-21),'#4aa3ff','#fff');
    else if(a.peer) tag(a.name,sx(a.x),sy(a.y-21),'#f4f1e8','#1d2330');
    else if(a.bubble&&(a.bt>0||a.carry)) tag(a.bubble,sx(a.x),sy(a.y-21),'#fff','#1d2330');
  });
  WH.forEach(w=>{if(w.worst==='r'&&w.staff[0]) tag('!',sx(w.staff[0].x),sy(w.staff[0].y-24),'#ef4f5f','#fff');});
  trucks.forEach(t=>{if(t.wait<=0)tag(t.id,sx(t.x),sy(t.y-16),'#1d2330','#fff');});
}
tickUI();renderLog();log('<span style="color:#9fe8ff">系統啟動・監控 9 庫房 × 7 agent 團隊</span>');
requestAnimationFrame(frame);
})();
